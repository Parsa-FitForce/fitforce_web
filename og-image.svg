<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f0f0f"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset=".5" stop-color="#E11D48"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset=".5" stop-color="#E11D48"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Logo -->
  <g transform="translate(100, 200)">
    <rect width="80" height="80" rx="18" fill="url(#logo-grad)"/>
    <rect x="17.5" y="26.25" width="12.5" height="27.5" rx="5" fill="#fff" fill-opacity=".95"/>
    <rect x="50" y="26.25" width="12.5" height="27.5" rx="5" fill="#fff" fill-opacity=".95"/>
    <rect x="26.25" y="35" width="27.5" height="10" rx="5" fill="#fff" fill-opacity=".88"/>
  </g>

  <!-- Title -->
  <text x="200" y="255" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="800" fill="#ffffff">FitForce</text>

  <!-- Tagline -->
  <text x="100" y="360" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" fill="#ffffff">Business Management</text>
  <text x="100" y="410" font-family="Inter, system-ui, sans-serif" font-size="36" font-weight="600" fill="#ffffff">for Personal Trainers</text>

  <!-- Subtitle -->
  <text x="100" y="490" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#a0a0a0">Scheduling, payments, waivers, insurance, and tax tracking in one place</text>

  <!-- Accent line -->
  <rect x="100" y="520" width="200" height="4" rx="2" fill="url(#text-gradient)"/>
</svg>
