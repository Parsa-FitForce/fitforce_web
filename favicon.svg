<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#7C3AED" flood-opacity="0.35"/>
    </filter>

    <clipPath id="rc">
      <rect x="20" y="20" width="472" height="472" rx="100" ry="100"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="20" y="20" width="472" height="472" rx="100" ry="100" fill="url(#brand)" filter="url(#shadow)"/>

  <g clip-path="url(#rc)">
    <rect x="20" y="20" width="472" height="472" fill="#06001a" opacity="0.18"/>

    <!-- Double chevron — stacked upward arrows -->
    <!-- Top chevron -->
    <path d="M148,260 L256,152 L364,260"
          stroke="white" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>

    <!-- Bottom chevron -->
    <path d="M148,360 L256,252 L364,360"
          stroke="white" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>

    <!-- Glass top highlight -->
    <ellipse cx="250" cy="80" rx="180" ry="70" fill="white" opacity="0.04"/>
  </g>
</svg>